name: Push Channel Test

# 手动验证已配置的企业微信和飞书 Webhook 推送通道。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check delivery channel
        id: check_wecom
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # 目标群：不带它脚本会拒绝发送（默认不许群发）。自检也进这些群。
          # 多群 = 多个独立 Secret，脚本合并去重后逐个投递（与 weekly.yml 同一套口径）。
          WECOM_CHATID: ${{ secrets.WECOM_CHATID }}
          WECOM_CHATID_2: ${{ secrets.WECOM_CHATID_2 }}
          WECOM_CHATID_3: ${{ secrets.WECOM_CHATID_3 }}
          WECOM_MSG_TYPE: ${{ secrets.WECOM_MSG_TYPE }}
        run: |
          if [ -z "$WECOM_WEBHOOK" ]; then
            echo "::warning::未配置 WECOM_WEBHOOK，跳过企业微信通道自检。"
            exit 0
          fi
          python scripts/monitor/send_wecom.py --check

      - name: Check Feishu delivery channel
        if: ${{ always() && steps.check_wecom.outcome != 'skipped' }}
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ] && [ -z "$FEISHU_SECRET" ]; then
            echo "::warning::未配置 FEISHU_WEBHOOK / FEISHU_SECRET，跳过飞书通道自检。"
            exit 0
          fi
          python scripts/monitor/send_feishu.py --check
